name: ASIF GESTURE AI APK BUILD

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Android Project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p android-project

          unzip -q ASIF-GESTURE-AI-FINAL.zip -d android-project

          ls -la android-project

      - name: Build APK
        run: |
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASIF-GESTURE-AI-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
