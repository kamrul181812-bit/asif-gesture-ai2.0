name: ASIF GESTURE AI APK BUILD

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Install unzip
      - name: Install Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Extract Android Project
      - name: Extract Android Project
        run: |
          mkdir -p android-project

          unzip -q ASIF-GESTURE-AI-FINAL.zip -d android-project

          echo "Project extracted successfully"

          ls -la android-project

          if [ ! -f android-project/gradlew ]; then
            echo "ERROR: gradlew not found!"
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi

      # 5. Setup Gradle Wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Generate Debug Keystore
      - name: Generate Debug Keystore
        run: |
          cd android-project

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 7. Build APK
      - name: Build Debug APK
        run: |
          cd android-project

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 8. Check APK
      - name: Verify APK
        run: |
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASIF-GESTURE-AI-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
