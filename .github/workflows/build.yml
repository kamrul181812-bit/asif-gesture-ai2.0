name: ASIF GESTURE AI APK BUILD

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find Android Project
        id: project
        run: |
          FILE=$(find . -type f -name gradlew -not -path './.git/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: gradlew not found!"
            echo "Repository files:"
            ls -la
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$FILE"

          echo "Project found: $DIR"

      - name: Build Debug APK
        run: |
          ./gradlew -p "${{ steps.project.outputs.dir }}" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASIF-GESTURE-AI-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
